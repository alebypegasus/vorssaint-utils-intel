name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v3.4.3)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Universal DMG
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up signing (if credentials provided)
        if: env.SIGNING_CERT_P12 != ''
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./Tools/ci-setup-signing.sh

      - name: Build Universal Binary (arm64 & x86_64)
        run: ./build.sh

      - name: Verify Universal 2 Binary
        run: |
          lipo -info build/Vorssaint | grep "x86_64" | grep "arm64"
          lipo -info build/com.vorssaint.utils.fan-control | grep "x86_64" | grep "arm64"
          lipo -info build/libVorssaintNowPlaying.dylib | grep "x86_64" | grep "arm64"

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Notarize app (if credentials provided)
        if: env.NOTARY_API_KEY_P8 != ''
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./Tools/notarize.sh build/stage/*.app

      - name: Package Universal DMG
        run: ./Tools/make-dmg.sh

      - name: Notarize DMG (if credentials provided)
        if: env.NOTARY_API_KEY_P8 != ''
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./Tools/notarize.sh dist/*.dmg

      - name: Prepare release metadata & notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == "main" || -z "$TAG" || "$TAG" == *"/"* ]]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [[ -z "$TAG" ]]; then
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist 2>/dev/null || echo '3.4.2')"
            TAG="v$VERSION"
          fi
          VERSION="${TAG#v}"

          NOTES=""
          if grep -Fq "## [$VERSION]" CHANGELOG.md 2>/dev/null; then
            NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          fi
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            NOTES="Universal release build for Apple Silicon (\`arm64\`) and Intel (\`x86_64\`) Macs."
          fi

          {
            echo "TAG=$TAG"
            echo "NOTES<<__VRSS_EOF__"
            printf '%s\n' "$NOTES"
            echo ""
            echo "---"
            echo "**Universal Edition**: Native support for Apple Silicon (\`arm64\`) and Intel (\`x86_64\`). Requires macOS 14 Sonoma or newer."
            echo "__VRSS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vorssaint-Universal-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.notes.outputs.TAG }}
          name: "Vorssaint Utils ${{ steps.notes.outputs.TAG }} (Universal)"
          files: dist/*.dmg
          body: ${{ steps.notes.outputs.NOTES }}
          make_latest: true
